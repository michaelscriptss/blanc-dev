<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oxford Response Live Region Monitor</title>
    <style>
        :root { 
            --bg-color: #0d0d0d; 
            --card-bg: #1a1a1a; 
            --border: #333333; 
            --primary: #e0e0e0; 
            --accent: #ff4444; 
            --text-muted: #888888;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-color); color: var(--primary); display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { padding: 15px; background: var(--card-bg); width: 100%; text-align: center; border-bottom: 1px solid var(--border); }
        .header h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
        .header h1 span { color: var(--accent); }
        
        .container { display: flex; gap: 15px; padding: 15px; width: 100%; max-width: 1400px; flex-wrap: wrap; justify-content: center; }
        
        .map-wrapper { position: relative; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--border); width: 100%; max-width: 800px; touch-action: none; }
        .map-wrapper img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; -webkit-user-drag: none; }
        
        /* The draggable region adjuster */
        #region-box { position: absolute; border: 2px dashed var(--accent); background: rgba(255, 68, 68, 0.1); cursor: grab; display: none; width: 200px; height: 200px; border-radius: 8px; touch-action: none; }
        #region-box:active { cursor: grabbing; }
        .resize-handle { position: absolute; bottom: -8px; right: -8px; width: 16px; height: 16px; background: var(--accent); border-radius: 50%; border: 2px solid var(--bg-color); touch-action: none; cursor: nwse-resize; }
        
        .controls { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border: 1px solid var(--border); width: 100%; max-width: 400px; flex: 1; }
        .btn { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 15px; font-size: 16px; }
        .btn:hover, .btn:active { background: #cc0000; transform: scale(0.98); }
        
        .coord-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .coord-inputs input { padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: #252525; color: #fff; width: 100%; box-sizing: border-box; font-size: 14px; }
        .coord-inputs label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; display: block; }
        
        .alerts-box { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 15px; max-height: 300px; overflow-y: auto; }
        .alerts-box::-webkit-scrollbar { width: 4px; }
        .alerts-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .alert-item { background: #252525; border-left: 3px solid var(--accent); padding: 12px; margin-bottom: 8px; border-radius: 4px; font-size: 14px; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .alert-item strong { color: #fff; }
        .status { font-size: 14px; color: var(--text-muted); text-align: center; padding: 10px; }
        .empty-state { color: var(--text-muted); text-align: center; font-size: 13px; padding: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚨 <span>Oxford</span> Response - Region Tracker</h1>
    </div>

    <div class="container">
        <div class="map-wrapper" id="mapWrapper">
            <!-- LOCAL MAP IMAGE -->
            <img id="mapImage" src="/images/map.png" alt="Oxford Response Map">
            <div id="region-box">
                <div class="resize-handle" id="resizeHandle"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="enableDrawBtn">✏️ Toggle Region Adjuster</button>
            <div id="statusMsg" class="status">Status: Idle</div>
            
            <div class="coord-inputs">
                <div><label>Min X</label><input type="text" id="minX" readonly></div>
                <div><label>Min Z</label><input type="text" id="minZ" readonly></div>
                <div><label>Max X</label><input type="text" id="maxX" readonly></div>
                <div><label>Max Z</label><input type="text" id="maxZ" readonly></div>
            </div>

            <div class="alerts-box" id="alertsBox">
                <div class="empty-state">No entries detected yet.</div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ UPDATED URL
        const API_URL = 'https://michaelscriptss-blanc-dev.vercel.app/api/players';
        
        const MAP_TOP_LEFT = { x: -6700, z: -2500 };
        const MAP_BOTTOM_RIGHT = { x: 1450, z: 3800 };

        const mapWrapper = document.getElementById('mapWrapper');
        const regionBox = document.getElementById('region-box');
        const resizeHandle = document.getElementById('resizeHandle');
        const enableDrawBtn = document.getElementById('enableDrawBtn');
        const statusMsg = document.getElementById('statusMsg');
        const alertsBox = document.getElementById('alertsBox');
        const minXInput = document.getElementById('minX');
        const minZInput = document.getElementById('minZ');
        const maxXInput = document.getElementById('maxX');
        const maxZInput = document.getElementById('maxZ');

        let isActive = false;
        let isDragging = false;
        let isResizing = false;
        let startX, startY, startLeft, startTop, startWidth, startHeight;
        let trackedPlayers = {};

        // --- TOUCH & MOUSE DRAG LOGIC ---
        function getPointerPos(e) {
            if (e.touches) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }

        function startDrag(e, type) {
            if (!isActive) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            const rect = regionBox.getBoundingClientRect();
            const wrapperRect = mapWrapper.getBoundingClientRect();

            startX = pos.x;
            startY = pos.y;
            startLeft = rect.left - wrapperRect.left;
            startTop = rect.top - wrapperRect.top;
            startWidth = rect.width;
            startHeight = rect.height;

            if (type === 'move') isDragging = true;
            if (type === 'resize') isResizing = true;
        }

        function onPointerMove(e) {
            if (!isActive || (!isDragging && !isResizing)) return;
            e.preventDefault();
            const pos = getPointerPos(e);
            const wrapperRect = mapWrapper.getBoundingClientRect();

            if (isDragging) {
                let newLeft = startLeft + (pos.x - startX);
                let newTop = startTop + (pos.y - startY);
                regionBox.style.left = Math.max(0, newLeft) + 'px';
                regionBox.style.top = Math.max(0, newTop) + 'px';
                updateCoordinates();
            }
            
            if (isResizing) {
                let newWidth = startWidth + (pos.x - startX);
                let newHeight = startHeight + (pos.y - startY);
                regionBox.style.width = Math.max(50, newWidth) + 'px';
                regionBox.style.height = Math.max(50, newHeight) + 'px';
                updateCoordinates();
            }
        }

        function stopDrag() {
            isDragging = false;
            isResizing = false;
        }

        // Mouse Events
        regionBox.addEventListener('mousedown', (e) => { if (e.target !== resizeHandle) startDrag(e, 'move'); });
        resizeHandle.addEventListener('mousedown', (e) => { e.stopPropagation(); startDrag(e, 'resize'); });
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', stopDrag);

        // Touch Events (For iPads / Mobiles)
        regionBox.addEventListener('touchstart', (e) => { if (e.target !== resizeHandle) startDrag(e, 'move'); }, { passive: false });
        resizeHandle.addEventListener('touchstart', (e) => { e.stopPropagation(); startDrag(e, 'resize'); }, { passive: false });
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('touchend', stopDrag);

        // --- UI LOGIC ---
        enableDrawBtn.addEventListener('click', () => {
            isActive = !isActive;
            regionBox.style.display = isActive ? 'block' : 'none';
            enableDrawBtn.textContent = isActive ? '🔒 Lock Region' : '✏️ Toggle Region Adjuster';
            statusMsg.textContent = isActive ? 'Drag to move. Grab corner to resize.' : 'Monitor active.';
        });

        function updateCoordinates() {
            const rect = regionBox.getBoundingClientRect();
            const wrapperRect = mapWrapper.getBoundingClientRect();
            const pctLeft = (rect.left - wrapperRect.left) / wrapperRect.width;
            const pctTop = (rect.top - wrapperRect.top) / wrapperRect.height;
            const pctRight = (rect.right - wrapperRect.left) / wrapperRect.width;
            const pctBottom = (rect.bottom - wrapperRect.top) / wrapperRect.height;

            minXInput.value = Math.round(MAP_TOP_LEFT.x + (MAP_BOTTOM_RIGHT.x - MAP_TOP_LEFT.x) * pctLeft);
            minZInput.value = Math.round(MAP_TOP_LEFT.z + (MAP_BOTTOM_RIGHT.z - MAP_TOP_LEFT.z) * pctTop);
            maxXInput.value = Math.round(MAP_TOP_LEFT.x + (MAP_BOTTOM_RIGHT.x - MAP_TOP_LEFT.x) * pctRight);
            maxZInput.value = Math.round(MAP_TOP_LEFT.z + (MAP_BOTTOM_RIGHT.z - MAP_TOP_LEFT.z) * pctBottom);
        }

        setTimeout(() => {
            regionBox.style.left = '30%';
            regionBox.style.top = '30%';
            updateCoordinates();
        }, 100);

        function checkBounds(x, z) {
            const minX = parseFloat(minXInput.value);
            const maxX = parseFloat(maxXInput.value);
            const minZ = parseFloat(minZInput.value);
            const maxZ = parseFloat(maxZInput.value);
            return x >= Math.min(minX, maxX) && x <= Math.max(minX, maxX) && z >= Math.min(minZ, maxZ) && z <= Math.max(minZ, maxZ);
        }

        async function fetchPlayers() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                data.forEach(player => {
                    const x = player.Coordinates.X;
                    const z = player.Coordinates.Z;
                    const name = player.DisplayName || player.Username || "Unknown";

                    if (checkBounds(x, z)) {
                        if (!trackedPlayers[player.UserId]) {
                            trackedPlayers[player.UserId] = true;
                            addAlert(name, x, z);
                        }
                    } else {
                        delete trackedPlayers[player.UserId];
                    }
                });
                statusMsg.textContent = `Monitoring (${Object.keys(data).length} players online)`;
            } catch (error) {
                statusMsg.textContent = "Error connecting to API.";
                console.error(error);
            }
        }

        function addAlert(name, x, z) {
            const item = document.createElement('div');
            item.className = 'alert-item';
            const time = new Date().toLocaleTimeString();
            item.innerHTML = `<strong>${name}</strong> entered region at <br>X: ${Math.round(x)}, Z: ${Math.round(z)} <span style="float:right;color:#666;font-size:11px;">${time}</span>`;
            alertsBox.prepend(item);
            while(alertsBox.children.length > 50) alertsBox.removeChild(alertsBox.lastChild);
        }

        setInterval(fetchPlayers, 3000);
        fetchPlayers();
    </script>
</body>
</html>
